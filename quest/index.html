<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>02:39</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quest.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <span class="mark">02:39</span>
    <button class="menu-btn" id="menuBtn" aria-label="Меню">···</button>
  </header>

  <section class="card" id="card" hidden>
    <p class="num" id="num"></p>
    <div class="text" id="text"></div>
    <img class="pic" id="pic" alt="" hidden>
    <form class="answer" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="ответ" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" id="go">→</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <button class="hint-btn" id="hintBtn" type="button">подсказка</button>
    <ol class="hints" id="hints"></ol>
  </section>

  <section class="final" id="final" hidden>
    <div class="text" id="finalText"></div>
    <div class="video" id="video"></div>
  </section>

  <p class="loading" id="loading">…</p>
</main>

<dialog class="sheet" id="sheet">
  <p class="sheet-title">Продолжить на другом телефоне</p>
  <p class="sheet-note">Скопируй код и вставь его на другом устройстве.</p>
  <textarea id="saveCode" readonly rows="3"></textarea>
  <div class="sheet-row">
    <button type="button" id="copyBtn">копировать</button>
  </div>
  <p class="sheet-note">Или вставь код отсюда:</p>
  <textarea id="loadCode" rows="3" placeholder="код"></textarea>
  <div class="sheet-row">
    <button type="button" id="loadBtn">загрузить</button>
    <button type="button" id="closeBtn">закрыть</button>
  </div>
</dialog>

<script src="quest.js"></script>
</body>
</html>
